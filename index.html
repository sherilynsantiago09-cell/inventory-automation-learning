
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
    }

    .dashboard {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #1f2937;
    }

    .card {
      background: #eef2ff;
      padding: 16px;
      margin-top: 15px;
      border-radius: 8px;
    }

    .healthy {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="dashboard">
    <h1>My Inventory Dashboard</h1>

    <p>Generated automatically by Google Apps Script.</p>

    <div class="card">
      <h2>Sample Product</h2>
      <p>Available Stock: 100 units</p>
      <p>Weekly Sales: 20 units</p>
      <p>Weeks Left: 5</p>
      <p class="healthy">Status: Healthy</p>
    </div>

    <p>Last updated: Tue Aug 04 2026 18:13:42 GMT-0700 (Pacific Daylight Time)</p>
  </div>
</body>
</html>
